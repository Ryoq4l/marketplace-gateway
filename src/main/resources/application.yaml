spring:
  application:
    name: marketplace-gateway
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
          routes:
            - id: auth-service
              uri: lb://marketplace-auth
              predicates:
                - Path=/api/v1/auth/**, /oauth2/**
            - id: wallet-service
              uri: lb://marketplace-wallet
              predicates:
                - Path=/api/v1/wallets/**
            - id: catalog-service
              uri: lb://marketplace-catalog
              predicates:
                - Path=/api/v1/items/**
            - id: order-service
              uri: lb://marketplace-order
              predicates:
                - Path=/api/v1/orders/**

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}
springdoc:
  swagger-ui:
    urls:
      - name: Auth Service
        url: /api/v1/auth/v3/api-docs
      - name: Wallet Service
        url: /api/v1/wallets/v3/api-docs
      - name: Catalog Service
        url: /api/v1/items/v3/api-docs
      - name: Order Service
        url: /api/v1/orders/v3/api-docs